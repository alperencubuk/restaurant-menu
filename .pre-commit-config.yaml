# Run `pre-commit run` to apply the hooks to the files you have staged.
# Run `pre-commit run --all-files` to apply the hooks to all files.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check
        args: [--extend-select, I, --fix]
      - id: ruff-format
        args: [--line-length=88]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
